[project]
name = "media-lan"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"demo/make_library.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "server:demo:android/e2e"
explicit_package_bases = true
namespace_packages = true
files = ["server", "tests", "demo", "android/e2e", "android/logo.py"]
