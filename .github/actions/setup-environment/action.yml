name: 'Setup Environment'
description: 'Creates the Python venv with the pinned development tools'
runs:
  using: 'composite'
  steps:
    - name: Python venv (system python3, pinned versions)
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --quiet --upgrade pip
        .venv/bin/pip install --quiet -r requirements-dev.txt
        .venv/bin/python --version
