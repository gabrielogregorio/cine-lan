version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "monthly"
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "Bump"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "Bump"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "Bump"
